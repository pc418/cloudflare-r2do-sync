name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            plugin/package-lock.json
            worker/package-lock.json
      - name: Install dependencies
        run: |
          npm ci --prefix plugin
          npm ci --prefix worker
      - name: Test scripts
        run: node --test scripts/*.test.mjs
      # Lint runs here but deliberately NOT in release.yml: its baseline is zero, so a nonzero
      # exit means something new, but it is also the most churn-prone check in the repo and
      # must never be what stops a tagged release from publishing.
      - name: Test, typecheck and lint plugin
        run: |
          npm test --prefix plugin
          npm run typecheck --prefix plugin
          npm run lint --prefix plugin
      - name: Test, typecheck and lint Worker
        run: |
          npm test --prefix worker
          npm run typecheck --prefix worker
          npm run lint --prefix worker
      - name: Build and validate release layout
        run: |
          npm run build --prefix plugin
          node scripts/release-validate.mjs
